[package]
name = "zbase-studio"
version = "0.2.0"
description = "ZBase Studio — Modern multi-engine database browser and editor"
authors = ["TheHolyOneZ <etienne.busch.performance@gmail.com>"]
edition = "2021"

[lib]
name = "zbase_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-store = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

rusqlite = { version = "0.32", features = [
  "bundled",
  "blob",
  "column_decltype",
  "load_extension",
  "backup",
  "functions",
  "limits",
] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
duckdb = { version = "1.1", features = ["bundled"] }

rayon = "1"
csv = "1.3"
parking_lot = "0.12"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
crossbeam-channel = "0.5"
base64 = "0.22"
regex = "1"
dirs = "5"

sqlx = { version = "0.8", features = ["runtime-tokio", "tls-native-tls", "postgres", "mysql", "chrono", "json"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
